name: Sales
options:
  bundleIdPrefix: xyz.justsal
  deploymentTarget: { iOS: "17.0" }
packages:
  SalesKit: { path: Packages/SalesKit }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Sales:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: SalesKit
      - target: SalesWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.justsal.Sales
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shopify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: { UIColorName: LaunchBackground }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
  SalesWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: SalesKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.justsal.Sales.Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Shopify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SalesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Sales
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.justsal.SalesUITests
schemes:
  Sales:
    build:
      targets:
        Sales: all
    test:
      targets: [SalesUITests]
